{% extends 'PlantillaGeneral.html' %}
{% load static %}

{% block contenido %}
<section class="padding-medium">
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-3">
          <div class="card-body p-4 p-md-5">
            
            <div class="text-center mb-4">
              <img src="{% static 'images/main-logo.png' %}" alt="NEXORA EXPRESS" class="img-fluid mb-3" style="max-height: 50px;">
              <h3 class="fw-bold text-uppercase">Iniciar Sesión</h3>
              <p class="text-muted">Ingresa a tu cuenta de NEXORA EXPRESS</p>
            </div>

            <form id="formLogin" method="post" action="{% url 'login' %}">
              {% csrf_token %}

              <div class="form-group mb-3">
                <label for="username" class="form-label text-uppercase fw-bold small">Usuario</label>
                <input type="text" class="form-control form-control-lg rounded-2 ps-3" id="username" name="username" placeholder="Tu usuario" required autofocus>
              </div>

              <div class="form-group mb-4">
                <label for="password" class="form-label text-uppercase fw-bold small">Contraseña</label>
                <input type="password" class="form-control form-control-lg rounded-2 ps-3" id="password" name="password" placeholder="••••••••" required>
              </div>

              <div class="d-grid gap-2 d-md-flex justify-content-md-end mb-3">
                <button type="button" onclick="history.back()" class="btn btn-outline-secondary btn-lg px-4 me-md-2 fw-bold">
                  <i class="fa-solid fa-xmark me-1"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-dark btn-lg px-5 text-uppercase fw-bold shadow-sm">Ingresar</button>
              </div>

            </form>

            <div class="text-center mt-4">
              <p class="mb-0 text-muted">¿No tienes cuenta? <a href="{% url 'register' %}" class="fw-bold text-dark text-decoration-none">Regístrate aquí</a></p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    $("#formLogin").validate({
      rules: {
        username: {
          required: true,
          minlength: 3
        },
        password: {
          required: true,
          minlength: 6
        }
      },
      messages: {
        username: {
          required: "Por favor, ingresa tu usuario.",
          minlength: "El usuario debe tener al menos 3 caracteres."
        },
        password: {
          required: "Por favor, ingresa tu contraseña.",
          minlength: "La contraseña debe tener al menos 6 caracteres."
        }
      },
      errorElement: "span",
      errorClass: "text-danger small mt-1 d-block",
      highlight: function(element) {
        $(element).addClass("is-invalid").removeClass("is-valid");
      },
      unhighlight: function(element) {
        $(element).removeClass("is-invalid").addClass("is-valid");
      },
      submitHandler: function(form) {
        Swal.fire({
          title: 'Iniciar Sesión',
          text: "¿Deseas acceder a tu cuenta?",
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#212529',
          cancelButtonColor: '#6c757d',
          confirmButtonText: '<i class="fa-solid fa-right-to-bracket me-1"></i> Sí, Ingresar',
          cancelButtonText: 'Cancelar'
        }).then((result) => {
          if (result.isConfirmed) {
            form.submit();
          }
        });
      }
    });
  });
</script>
{% endblock %}
